[package]
name = "check-updates-root"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/check-updates-cli"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/explodingcamera/check-updates"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
check-updates = { path = "crates/check-updates", version = "0.4" }
glob = "0.3"
nodejs-semver = "7.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "1.3"
tempfile = "3.27"

cargo_metadata = "0.23"
disponent = "0.2"
env_logger = "0.11"
http = "1.5"
log = "0.4"
purl = "0.1"
reqwest = { version = "0.13", default-features = false, features = [
  "http2",
  "rustls"
] }
semver = "1.0"
tame-index = "0.26"
thiserror = "2.0"
tokio = "1.53"

clap = { version = "4.6", features = ["color", "derive", "unstable-styles"] }
clap_complete = "4.6"
console = { version = "0.16", default-features = false }
indicatif = "0.18"
toml_edit = "0.25"

[dependencies]
check-updates.workspace = true
semver.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[profile.release]
debug = false
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
