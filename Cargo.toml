[package]
name = "check-updates-root"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

[dependencies]
check-updates.workspace = true
semver.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/check-updates"]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.98"
repository = "https://github.com/explodingcamera/check-updates"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bpaf = { version = "0.9", features = ["autocomplete", "bright-color", "derive"] }
check-updates = { path = "crates/check-updates", version = "0.8" }
glob = "0.3"
granit-parser = { version = "2.2", default-features = false, features = ["std"] }
jiff = { version = "1.0", default-features = false, features = ["std"] }
nodejs-semver = "7.0"
owo-colors = { version = "4.4", features = ["supports-colors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"

cargo_metadata = "0.23"
console = { version = "0.16", default-features = false }
disponent = "0.2"
http = "1.5"
log = "0.4"
purl = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls"] }
semver = "1.0"
tame-index = "0.27"
thiserror = "2.0"
tokio = "1.54"
toml_edit = "0.25"

[profile.release]
debug = false
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
