name: Run tests

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yaml"
  push:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy, rustfmt
          build-warnings: ""
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Run tests
        run: cargo test --all --all-features
      - name: Test JavaScript package managers
        run: cargo test -p check-updates-cli --test upgrade -- --ignored
      - name: Check individual backends
        run: |
          cargo check -p check-updates --no-default-features --features cargo
          cargo check -p check-updates --no-default-features --features npm
      - name: Run clippy
        run: cargo clippy --all-features
      - name: Run fmt
        run: cargo fmt --all -- --check
        continue-on-error: true
