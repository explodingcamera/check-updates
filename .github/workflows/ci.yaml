name: Run tests

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yaml"
  push:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          components: clippy, rustfmt
          build-warnings: ""
      - name: Run tests
        run: cargo test --all --all-features
      - name: Check individual backends
        run: |
          cargo check -p check-updates-cli --no-default-features --features cargo
          cargo check -p check-updates-cli --no-default-features --features npm
      - name: Run clippy
        run: cargo clippy --all-features
      - name: Run fmt
        run: cargo fmt --all -- --check
        continue-on-error: true
