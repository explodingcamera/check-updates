name: Release Build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1.11.0
        with:
          draft: true
          allow-missing-changelog: true
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: check-updates-amd64-linux
            archive-format: tar.xz
          - target: x86_64-pc-windows-gnu
            os: windows-latest
            archive: check-updates-amd64-windows
            archive-format: zip
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: check-updates-arm64-linux
            archive-format: tar.xz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: check-updates-arm64-darwin
            archive-format: tar.xz
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
          target: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: check-updates,cargo-check-updates
          package: check-updates-cli
          target: ${{ matrix.target }}
          archive: ${{ matrix.archive }}
          tar-xz: ${{ matrix.archive-format == 'tar.xz' && 'all' || 'none' }}
          zip: ${{ matrix.archive-format == 'zip' && 'all' || 'none' }}
          tar: none
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
